{% extends "base.html" %}

{% block title %}Dashboard - PrintIA Solutions{% endblock %}

{% block content %}
<div class="dashboard-container">
    <aside class="dashboard-sidebar">
        <a href="{{ url_for('main.dashboard') }}" class="sidebar-link {% if request.endpoint == 'main.dashboard' %}sidebar-link--active{% endif %}">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
            </svg>
            <span>Resumen</span>
        </a>
        <a href="{{ url_for('main.generador') }}" class="sidebar-link {% if request.endpoint == 'main.generador' %}sidebar-link--active{% endif %}">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Generador</span>
        </a>
        <a href="{{ url_for('main.galeria') }}" class="sidebar-link {% if request.endpoint == 'main.galeria' %}sidebar-link--active{% endif %}">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Galería</span>
        </a>

        {% if current_user.es_admin %}
        <div class="sidebar-divider" style="margin: 1.5rem 0 0.5rem 0; border-top: 1px solid rgba(0,0,0,0.05);"></div>
        <div class="sidebar-section-title" style="text-align: center; font-size: 0.75rem; font-weight: 700; color: #E64D85; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Admin</div>
        
        <a href="{{ url_for('main.admin_dashboard') }}" class="sidebar-link {% if request.endpoint == 'main.admin_dashboard' %}sidebar-link--active{% endif %}">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <path d="M7 10h10M7 14h10M7 18h10M7 6h10"></path>
            </svg>
            <span>Métricas</span>
        </a>
        <a href="{{ url_for('main.admin_usuarios') }}" class="sidebar-link {% if request.endpoint == 'main.admin_usuarios' %}sidebar-link--active{% endif %}">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Usuarios</span>
        </a>
        {% endif %}
    </aside>

    <main class="dashboard-content">
        {% block dashboard_content %}{% endblock %}
    </main>
</div>
{% endblock %}
